<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BioBox · Grafiken</title>
  <link rel="stylesheet" href="grafiken.css">
  <script src="grafiken.js" defer></script>
</head>
<body>
  <main>
    <header><h1>BioBox</h1></header>
    <div class="toolbar" id="chart-toolbar" hidden>
      <nav aria-label="Grafiken">
        <a href="#wachstum" data-file="01_wachstum.png">Wachstum</a>
        <a href="#wachstumsrate" data-file="02_wachstumsrate.png">Wachstumsrate</a>
        <a href="#farbverlauf" data-file="03_farbverlauf.png">Farbverlauf</a>
        <a href="#gesundheit" data-file="04_gesundheit.png">Gesundheit</a>
        <a href="#teilscores" data-file="05_teilscores.png">Teilbewertungen</a>
      </nav>
      <a class="open" id="chart-open" target="_blank" rel="noopener" hidden>PNG öffnen</a>
    </div>
    <figure aria-label="Aktuelle Grafik">
      <img id="chart-image" alt="" hidden>
      <p id="chart-status" class="empty" role="status">Grafiken werden geladen …</p>
    </figure>
  </main>
  <noscript>Die PNG-Dateien können direkt im Ordner geöffnet werden.</noscript>
</body>
</html>
